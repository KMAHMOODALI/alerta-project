name: Alerta CI

on:
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout Alerta
        uses: actions/checkout@v4

      - name: Show project files
        run: |
          echo "===== Repository ====="
          pwd
          echo
          ls -la
          echo
          echo "===== Git ====="
          git branch --show-current
          git log -1 --oneline

      - name: Check Python environment
        run: |
          echo "===== Python ====="
          python3 --version
          pip3 --version || true

      - name: Detect project structure
        run: |
          echo "===== Project files ====="

          [ -f requirements.txt ] && echo "Found requirements.txt"
          [ -f pyproject.toml ] && echo "Found pyproject.toml"
          [ -f setup.py ] && echo "Found setup.py"

          echo
          echo "===== Test directories ====="
          find . -maxdepth 3 -type d \
            \( -name tests -o -name test \) \
            -print

      - name: CI completed
        run: |
          echo "====================================="
          echo "Alerta CI checkout/check completed"
          echo "====================================="
