```yaml
name: Alerta CI/CD

on:
  push:
    branches:
      - master

jobs:

  test:
    name: Test Alerta
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Python
        run: |
          python3 --version

      - name: Create virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python --version
          .venv/bin/pip --version

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip

          if [ -f requirements.txt ]; then
            .venv/bin/pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then
            .venv/bin/pip install .
          elif [ -f setup.py ]; then
            .venv/bin/pip install .
          else
            echo "No Python dependency file found"
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then
            .venv/bin/python -m pytest tests -v
          else
            echo "No tests directory found"
          fi


  deploy:
    name: Deploy Alerta
    needs: test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Pull latest Docker images
        run: |
          docker compose pull

      - name: Deploy Alerta
        run: |
          docker compose up -d --remove-orphans

      - name: Show running containers
        run: |
          docker compose ps

      - name: Wait for Alerta
        run: |
          echo "Waiting for Alerta..."

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/ > /dev/null; then
              echo "Alerta is available"
              exit 0
            fi

            echo "Attempt $i/30"
            sleep 2
          done

          echo "Alerta failed health check"
          docker compose ps
          docker compose logs --tail=100 alerta
          exit 1

      - name: Run Ansible
        run: |
          echo "Running Ansible QA deployment..."
          ansible-playbook -i inventory ansible/deploy-qa.yml

      - name: Deployment successful
        run: |
          echo "====================================="
          echo "Alerta deployment completed"
          echo "Ansible alerts deployed successfully"
          echo "====================================="
```
