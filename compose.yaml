services:

  alerta:
    image: alerta/alerta-web:latest
    container_name: alerta-qa
    ports:
      - "8080:8080"

    environment:
      DATABASE_URL: mongodb://mongodb:27017/monitoring
      DEBUG: "1"
      AUTH_REQUIRED: "false"

      ALLOWED_ENVIRONMENTS: "QA"
      DEFAULT_ENVIRONMENT: "QA"

    depends_on:
      - mongodb

    restart: unless-stopped


  mongodb:
    image: mongo:7
    container_name: alerta-qa-mongodb

    volumes:
      - mongodb_data:/data/db

    restart: unless-stopped


volumes:
  mongodb_data:
